name: Detect and build new upstream based release

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build even though there is no new upstream release."
        required: true
        default: false
        type: boolean

  push:
    tags: ["*"]

  schedule:
    # https://crontab.guru/#0_7_*_*_1-5
    - cron: "0 7 * * 1-5"

# Least privilege: no token permissions by default, each job asks for its own.
permissions: {}

# Serialise runs so a schedule and a manual dispatch can't race on the same tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_build == 'true' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout and read tags
    outputs:
      versions: ${{ steps.missing.outputs.versions }}
      highest: ${{ steps.upstream.outputs.highest }}
      sushi_version: ${{ steps.sushi.outputs.sushi_version }}
    steps:
      # https://github.com/actions/checkout/?tab=readme-ov-file#usage
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # fetch-tags: true # Does not work for some reason, so we use fetch-depth: 0

      # https://github.com/fut-infrastructure/ig-publisher/settings/variables/actions
      - name: Pipeline debug
        if: vars.DEBUG == 'true'
        run: |
          echo "Files:"
          ls -lav
          echo "Git info:"
          git status -bv
          git branch -v
          echo "Log:"
          git log --oneline --decorate --graph
          echo "Tags:"
          git tag | sort --version-sort
          echo "SemVer tags:"
          git tag | sort --version-sort | grep -Eo '[0-9]{1,}.[0-9]{1,}.[0-9]{1,}' 
          echo "Environment variables:"
          env

      - name: Get the upstream releases of FHIR-IG Publisher
        id: upstream
        run: |
          # https://docs.github.com/en/rest/releases/releases?#list-releases
          # Skip prereleases. Only the newest releases are checked, so old
          # versions that were never built aren't backfilled.
          curl -fsS "https://api.github.com/repos/HL7/fhir-ig-publisher/releases?per_page=20" \
            | jq -r '.[] | select(.prerelease | not) | .tag_name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort --version-sort > upstream.txt || true
          if [ ! -s upstream.txt ]; then
            echo "::error::No upstream release found"
            exit 1
          fi
          echo "Upstream releases: $(paste -sd ' ' upstream.txt)"
          # https://docs.github.com/en/actions/using-jobs/defining-outputs-for-jobs
          echo "highest=$(tail -1 upstream.txt)" >> $GITHUB_OUTPUT

      - name: Get the latest FSH SUSHI version
        id: sushi
        run: |
          # https://docs.github.com/en/rest/releases/releases?#get-the-latest-release
          sushi_tag=$(curl -fsS https://api.github.com/repos/FHIR/sushi/releases/latest | jq -r '.tag_name')
          # Strip leading 'v' for npm
          sushi_version="${sushi_tag#v}"
          echo "SUSHI upstream: $sushi_version (from tag $sushi_tag)"
          echo "sushi_version=$sushi_version" >> $GITHUB_OUTPUT

      # Whether the tag exists decides the build, so every upstream release gets
      # built once, including patches to older majors.
      # A SUSHI version bump also triggers a rebuild of the highest version so
      # the floating latest/nightly/sha tags pick up the new SUSHI.
      - name: Find upstream releases that are not built yet
        id: missing
        env:
          highest: ${{ steps.upstream.outputs.highest }}
          sushi_version: ${{ steps.sushi.outputs.sushi_version }}
        run: |
          versions=$(while read -r v; do
              git rev-parse -q --verify "refs/tags/$v" > /dev/null || echo "$v"
            done < upstream.txt)

          # Check if the current latest image has an outdated SUSHI.
          # Pull the label annotation set by docker/metadata-action, which
          # records the SUSHI version used at build time.
          needs_rebuild_for_sushi=false
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          if docker pull "$image" 2>/dev/null; then
            current_sushi=$(docker inspect "$image" \
              --format '{{ index .Config.Labels "org.opencontainers.image.version.sushi" }}' 2>/dev/null || true)
            echo "SUSHI in current latest image: ${current_sushi:-unknown}"
            if [ -n "$current_sushi" ] && [ "$current_sushi" != "$sushi_version" ]; then
              echo "SUSHI is outdated ($current_sushi -> $sushi_version), rebuilding highest"
              needs_rebuild_for_sushi=true
            fi
          else
            echo "Could not pull $image, will rebuild for SUSHI"
            needs_rebuild_for_sushi=true
          fi

          # A forced build also rebuilds the highest version, even if it is tagged.
          if [ "$FORCE_BUILD" = true ] || [ "$needs_rebuild_for_sushi" = true ]; then
            versions=$(printf '%s\n' $versions "$highest" | sort -uV)
          fi
          json=$(printf '%s\n' $versions | jq -Rnc '[inputs | select(length > 0)]')
          echo "To build: $json"
          echo "versions=$json" >> $GITHUB_OUTPUT

  build:
    needs: detect
    if: needs.detect.outputs.versions != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
      packages: write # push the image to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.detect.outputs.versions) }}
    env:
      IS_HIGHEST: ${{ matrix.version == needs.detect.outputs.highest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lowercase image name
        id: image
        env:
          name: ${{ env.IMAGE_NAME }}
        run: echo "name=${name,,}" >> $GITHUB_OUTPUT

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the highest upstream version moves the floating tags. latest=false
      # stops type=semver from adding `latest` to every version on its own.
      - name: Docker meta
        id: meta # you'll use this in the next step
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          flavor: latest=false
          # Docker tags based on the following events/attributes
          tags: |
            # priority above type=schedule (1000), so the version label/annotation is
            # the IG Publisher version and not `nightly`.
            type=semver,pattern={{version}},value=${{ matrix.version }},priority=1100
            type=raw,value=latest,enable=${{ env.IS_HIGHEST }}
            type=schedule,enable=${{ env.IS_HIGHEST }}
            type=ref,event=branch,enable=${{ env.IS_HIGHEST }}
            type=sha,enable=${{ env.IS_HIGHEST }}
          # Record the SUSHI version in a label so future runs can detect
          # when the image needs rebuilding for a new SUSHI release.
          labels: |
            org.opencontainers.image.version.sushi=${{ needs.detect.outputs.sushi_version }}

      - name: Build and push
        id: docker_build
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64 #,linux/arm64
          build-args: |
            IG_PUB_VERSION=${{ matrix.version }}
            SUSHI_VERSION=${{ needs.detect.outputs.sushi_version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha, scope=${{ github.workflow }}
          cache-to: type=gha, scope=${{ github.workflow }}

      # The tag is created after the build in case the build fails, which
      # would then prevent the tag from being created.
      # and the failed build would be retried at each schedule.
      # No -f: an existing tag (forced rebuild) is never moved, and a racing
      # push fails loudly.
      - name: Create tag for the upstream release
        env:
          version: ${{ matrix.version }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            git tag "$version"
            git push origin "$version"
          fi

      # Create a *draft* GitHub Release with auto-generated release notes.
      # Drafts are invisible to the public and don't trigger dependabot
      # notifications. A maintainer reviews the notes, adds any human
      # context, then publishes the release from the GitHub UI.
      # See .github/release.yml for the categorization config.
      - name: Create draft GitHub Release
        id: draft
        if: github.event_name != 'pull_request'
        env:
          version: ${{ matrix.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists, skipping"
            echo "created=false" >> $GITHUB_OUTPUT
          else
            gh release create "$version" \
              --draft \
              --generate-notes \
              --title "$version"
            echo "created=true" >> $GITHUB_OUTPUT
          fi

  # After all builds finish, create a single tracking issue for any
  # draft releases that were created in this run. The issue pings
  # maintainers to review the draft notes and publish. It closes
  # automatically when the release is published (via "on: release"
  # workflow or a linked release issue closer).
  notify:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Find drafts created in this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect all draft releases
          DRAFTS=$(gh release list --json name,isDraft,isLatest --jq '[.[] | select(.isDraft == true) | .name]')
          echo "Draft releases: $DRAFTS"

          if [ "$(echo "$DRAFTS" | jq 'length')" -eq 0 ]; then
            echo "No draft releases found, skipping"
            exit 0
          fi

          # Check if there's already an open issue tracking draft releases
          EXISTING=$(gh issue list \
            --state open \
            --search "Draft release awaiting review in:title" \
            --json number,title --jq '.[].number')

          if [ -n "$EXISTING" ]; then
            echo "Tracking issue #$EXISTING already open, adding a comment"
            BODY=$(echo "$DRAFTS" | jq -r '.[] | "- [\(.name)](https://github.com/${GITHUB_REPOSITORY}/releases/tag/\(.name))"')
            gh issue comment "$EXISTING" --body "Drafts still awaiting review:

          $BODY"
            exit 0
          fi

          # Create a new tracking issue
          BODY=$(echo "$DRAFTS" | jq -r '.[] | "- [\(.name)](https://github.com/${GITHUB_REPOSITORY}/releases/tag/\(.name))"')
          gh issue create \
            --title "Draft release awaiting review" \
            --body "The pipeline created one or more draft releases that need review before publishing.

          ## Draft releases
          $BODY

          ## Steps
          1. Review each draft release on the [releases page](https://github.com/${GITHUB_REPOSITORY}/releases)
          2. Edit the auto-generated notes to add context if needed
          3. Publish each release
          4. Close this issue"
